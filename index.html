      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sys: ['-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],

            tiktok: ['"TikTok Sans"', '-apple-system', 'sans-serif'],
            reddit: ['"Reddit Sans"', '-apple-system', 'sans-serif'],
            youtube: ['Roboto', 'Arial', 'sans-serif'],

            jakarta: ['"Plus Jakarta Sans"', '-apple-system', 'sans-serif']
          }
        }

    };
  </script>

  <style>
    @font-face {
      font-family: 'ABC Ginto Normal';
      src: url('./fonts/ABCGintoNormal-Regular.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'ABC Ginto Normal';
      src: url('./fonts/ABCGintoNormal-Medium.otf') format('opentype');
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'ABC Ginto Normal';
      src: url('./fonts/ABCGintoNormal-Bold.otf') format('opentype');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    [data-edit] {
      outline: none;
      border-radius: 6px;
      cursor: text;
      transition: background-color 0.15s ease, box-shadow 0.15s ease;
    }
    [data-edit]:hover {
      background-color: rgba(59, 130, 246, 0.08);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
    }
    [data-edit]:focus {
      background-color: rgba(59, 130, 246, 0.1);
      box-shadow: 0 0 0 2px #3b82f6;
    }

    body.exporting [data-edit] {
      box-shadow: none !important;
      background-color: transparent !important;
    }
    body.exporting .unverified-toggle {
      display: none !important;
    }

    .ig-ring {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="min-h-screen bg-[#f5f5f7] dark:bg-[#0a0a0c] text-neutral-900 dark:text-neutral-100 flex flex-col transition-colors duration-150">

  <header class="sticky top-0 z-30 bg-white/90 dark:bg-[#111114]/90 backdrop-blur-md border-b border-neutral-200 dark:border-neutral-800">
    <div class="max-w-4xl mx-auto px-4 sm:px-6 py-3 flex flex-col gap-3">
      
      <div class="flex items-center justify-between gap-3">
        <nav id="platformBar" class="flex items-center gap-2 overflow-x-auto no-scrollbar py-1" aria-label="Social Platforms"></nav>

        <div class="shrink-0 pl-3 border-l border-neutral-200 dark:border-neutral-800">
          <button id="themeBtn" type="button" title="Toggle Dark / Light Mode" aria-label="Toggle Dark / Light Mode" class="w-12 h-12 rounded-2xl flex items-center justify-center bg-neutral-100 dark:bg-neutral-800 text-neutral-700 dark:text-neutral-200 hover:bg-neutral-200 dark:hover:bg-neutral-700 active:scale-95 transition"></button>
        </div>
      </div>

      <div id="templateBar" class="flex items-center gap-2 overflow-x-auto no-scrollbar pb-1"></div>
    </div>
  </header>

  <main class="flex-1 flex flex-col items-center justify-center px-4 sm:px-6 py-8 sm:py-12">
    
    <p class="text-sm text-neutral-500 dark:text-neutral-400 mb-5 text-center">
      Tap any text to edit · Tap any image or avatar to upload · Tap reactions to toggle
    </p>

    <div id="mockupStage" class="w-full flex justify-center items-center"></div>

    <div class="mt-8 flex flex-wrap items-center justify-center gap-3 w-full max-w-md">
      <button id="downloadBtn" type="button" class="flex-1 min-w-[160px] py-3.5 px-6 rounded-2xl bg-neutral-900 dark:bg-white text-white dark:text-neutral-900 font-semibold text-base shadow-sm hover:opacity-90 active:scale-[0.98] transition flex items-center justify-center gap-2">
        <svg class="w-5 h-5 fill-none stroke-current" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5m0 0l5-5m-5 5V3"/>
        </svg>
        <span id="downloadBtnText">Download PNG</span>
      </button>

      <button id="resetBtn" type="button" class="py-3.5 px-6 rounded-2xl bg-white dark:bg-neutral-800 text-neutral-700 dark:text-neutral-200 border border-neutral-200 dark:border-neutral-700 font-semibold text-base hover:bg-neutral-100 dark:hover:bg-neutral-700 active:scale-[0.98] transition">
        Reset
      </button>
    </div>
  </main>

                ${mediaBox('media', 'aspect-video', 'Tap to upload stream preview')}
                <span class="absolute top-3.5 left-3.5 px-2.5 py-1 rounded bg-[#eb0400] text-white text-xs font-bold uppercase tracking-wider">LIVE</span>
                <span class="absolute bottom-3.5 left-3.5 px-2.5 py-1 rounded bg-black/75 text-white text-xs font-medium"><span ${edAttr('views')}>${escapeHtml(d.views)}</span> viewers</span>
              </div>
              <div class="p-5 flex items-start gap-3.5">
                <div class="p-0.5 rounded-full ring-2 ring-[#9146ff]">${avatarBox('avatar', 'w-12 h-12')}</div>
                <div class="flex-1 min-w-0">
                  <div class="font-bold text-base flex items-center gap-1.5"><span ${edAttr('name')}>${escapeHtml(d.name)}</span> ${vBadge('#9146ff', 'w-4 h-4')}</div>
                  <div class="text-sm font-medium mt-0.5 truncate" ${edAttr('title')}>${escapeHtml(d.title)}</div>
                  <div class="text-sm text-[#9146ff] font-medium mt-0.5" ${edAttr('streamCategory')}>${escapeHtml(d.streamCategory)}</div>
                </div>
                <button type="button" data-toggle="followed" class="px-4 py-2 rounded-xl text-sm font-bold bg-[#9146ff] text-white shrink-0">${d.followed ? 'Following' : 'Follow'}</button>
              </div>
            </div>`;

        case 'tw-profile':
          return `
            <div class="w-[600px] max-w-full font-inter rounded-3xl overflow-hidden border shadow-sm" style="background:${c.bg};color:${c.text};border-color:${c.border}">
              ${mediaBox('banner', 'h-36', 'Tap to upload channel banner')}
              <div class="p-5 sm:p-6 flex items-center gap-4">
                <div class="p-0.5 rounded-full ring-2 ring-[#9146ff] -mt-10 relative z-10" style="background:${c.bg}">${avatarBox('avatar', 'w-20 h-20')}</div>
                <div class="flex-1">
                  <div class="font-bold text-xl flex items-center gap-1.5"><span ${edAttr('name')}>${escapeHtml(d.name)}</span> ${vBadge('#9146ff', 'w-5 h-5')}</div>
                  <div class="text-sm" style="color:${c.muted}"><span ${edAttr('followers')}>${escapeHtml(d.followers)}</span> followers</div>
                </div>
                <button type="button" data-toggle="followed" class="px-5 py-2 rounded-xl text-sm font-bold bg-[#9146ff] text-white">${d.followed ? 'Following' : 'Follow'}</button>
              </div>
              <p class="px-6 pb-6 text-[15px] leading-relaxed" style="color:${c.muted}" ${edAttr('bio')}>${escapeHtml(d.bio)}</p>
            </div>`;

        case 'sp-player':
          return `
            <div class="w-[400px] max-w-full font-jakarta rounded-3xl p-6 border shadow-sm" style="background:${c.bg};color:${c.text};border-color:${c.border}">
              <div class="rounded-2xl overflow-hidden mb-5 shadow-sm">
                ${mediaBox('media', 'aspect-square', 'Tap to upload album art')}
              </div>
              <div class="flex items-center justify-between">
                <div>
                  <div class="font-bold text-lg" ${edAttr('trackTitle')}>${escapeHtml(d.trackTitle)}</div>
                  <div class="text-sm mt-0.5" style="color:${c.muted}" ${edAttr('artistName')}>${escapeHtml(d.artistName)}</div>
                </div>
                <button type="button" data-toggle="liked" class="w-10 h-10 rounded-full flex items-center justify-center text-xl ${d.liked ? 'text-[#1ed760]' : ''}">♥</button>
              </div>
              <div class="mt-5">
                <div class="h-1.5 w-full rounded-full overflow-hidden" style="background:${c.soft}">
                  <div class="h-full w-1/3 bg-[#1ed760] rounded-full"></div>
                </div>
                <div class="flex justify-between text-xs mt-1.5" style="color:${c.muted}">
                  <span>1:12</span>
                  <span>3:28</span>
                </div>
              </div>
              <div class="mt-3 flex items-center justify-center gap-7">
                <span class="text-base opacity-70">⏮</span>
                <span class="w-12 h-12 rounded-full bg-[#1ed760] text-black flex items-center justify-center font-bold text-base">▶</span>
                <span class="text-base opacity-70">⏭</span>
              </div>
            </div>`;

        case 'sp-artist':
          return `
            <div class="w-[580px] max-w-full font-jakarta rounded-3xl overflow-hidden border shadow-sm" style="background:${c.bg};color:${c.text};border-color:${c.border}">
              <div class="relative">
                ${mediaBox('banner', 'h-48', 'Tap to upload artist header')}
                <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent pointer-events-none"></div>
                <div class="absolute bottom-4 left-5 text-white">
                  <div class="text-xs font-semibold flex items-center gap-1.5">${vBadge('#3b82f6', 'w-4 h-4')} Verified Artist</div>
                  <div class="text-3xl font-extrabold tracking-tight mt-0.5" ${edAttr('artistName')}>${escapeHtml(d.artistName)}</div>
                  <div class="text-sm text-white/80 mt-0.5"><span ${edAttr('followers')}>${escapeHtml(d.followers)}</span> monthly listeners</div>
                </div>
              </div>
              <div class="p-5 flex items-center gap-4">
                <span class="w-12 h-12 rounded-full bg-[#1ed760] text-black flex items-center justify-center font-bold text-base">▶</span>
                <button type="button" data-toggle="followed" class="px-5 py-2 rounded-full text-sm font-bold border" style="border-color:${c.border}">${d.followed ? 'Following' : 'Follow'}</button>
              </div>
            </div>`;
      }
      return '';
    }

    function renderBars() {
      const pBar = document.getElementById('platformBar');
      pBar.innerHTML = PLATFORMS.map(p => {
        const active = p.id === app.platform;
        return `
          <button type="button" data-platform="${p.id}" title="${p.name}" aria-label="${p.name}" class="w-12 h-12 rounded-2xl flex items-center justify-center transition shrink-0 ${active ? 'bg-neutral-900 text-white dark:bg-white dark:text-neutral-900 shadow-sm' : 'text-neutral-500 hover:text-neutral-900 dark:text-neutral-400 dark:hover:text-white bg-neutral-100/80 dark:bg-neutral-800/60 hover:bg-neutral-200/70 dark:hover:bg-neutral-800'}">
            ${p.svg}
          </button>`;
      }).join('');

      const currentPlatform = PLATFORMS.find(p => p.id === app.platform) || PLATFORMS[0];
      const tBar = document.getElementById('templateBar');
      tBar.innerHTML = currentPlatform.templates.map(t => {
        const active = t.id === app.template;
        return `
          <button type="button" data-template="${t.id}" class="px-4 py-2 rounded-xl text-sm font-semibold transition shrink-0 ${active ? 'bg-neutral-900 text-white dark:bg-white dark:text-neutral-900' : 'text-neutral-600 hover:text-neutral-900 dark:text-neutral-400 dark:hover:text-white bg-neutral-100 dark:bg-neutral-800/80'}">
            ${t.label}
          </button>`;
      }).join('');

      const themeBtn = document.getElementById('themeBtn');
      themeBtn.innerHTML = app.dark
        ? '<svg class="w-6 h-6 fill-none stroke-current" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
        : '<svg class="w-6 h-6 fill-none stroke-current" stroke-width="2" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
    }

    function renderMockup() {
      const stage = document.getElementById('mockupStage');
      stage.innerHTML = renderTemplateById(app.template);
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.documentElement.classList.toggle('dark', app.dark);
      updateFavicon();

      const platformBar = document.getElementById('platformBar');
      const templateBar = document.getElementById('templateBar');
      const mockupStage = document.getElementById('mockupStage');
      const themeBtn = document.getElementById('themeBtn');
      const resetBtn = document.getElementById('resetBtn');
      const downloadBtn = document.getElementById('downloadBtn');
      const downloadBtnText = document.getElementById('downloadBtnText');
      const fileInput = document.getElementById('fileInput');

      platformBar.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-platform]');
        if (!btn) return;
        const pid = btn.getAttribute('data-platform');
        const found = PLATFORMS.find(p => p.id === pid);
        if (!found) return;
        app.platform = found.id;
        app.template = found.templates[0].id;
        renderBars();
        renderMockup();
      });

      templateBar.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-template]');
        if (!btn) return;
        app.template = btn.getAttribute('data-template');
        renderBars();
        renderMockup();
      });

      themeBtn.addEventListener('click', () => {
        app.dark = !app.dark;
        document.documentElement.classList.toggle('dark', app.dark);
        updateFavicon();
        renderBars();
        renderMockup();
      });

      resetBtn.addEventListener('click', () => {
        app.data = getDefaultState();
        renderMockup();
      });

      downloadBtn.addEventListener('click', async () => {
        const target = mockupStage.firstElementChild;
        if (!target) return;
        const prev = downloadBtnText.textContent;
        downloadBtnText.textContent = 'Saving...';
        document.body.classList.add('exporting');
        try {
          const canvas = await html2canvas(target, {
            scale: 2,
            useCORS: true,
            backgroundColor: null,
            logging: false
          });
          const a = document.createElement('a');
          a.download = `${app.template}-mockup.png`;
          a.href = canvas.toDataURL('image/png');
          a.click();
        } finally {
          document.body.classList.remove('exporting');
          downloadBtnText.textContent = prev;
        }
      });

      mockupStage.addEventListener('click', (e) => {
        const slotEl = e.target.closest('[data-slot]');
        if (slotEl) {
          activeImgSlot = slotEl.getAttribute('data-slot');
          fileInput.value = '';
          fileInput.click();
          return;
        }

        const toggleEl = e.target.closest('[data-toggle]');
        if (toggleEl) {
          const key = toggleEl.getAttribute('data-toggle');
          app.data[key] = !app.data[key];
          renderMockup();
        }
      });

      mockupStage.addEventListener('input', (e) => {
        const editEl = e.target.closest('[data-edit]');
        if (!editEl) return;
        const key = editEl.getAttribute('data-edit');
        app.data[key] = editEl.innerText;
      });

      fileInput.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file || !activeImgSlot) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          app.data.images[activeImgSlot] = ev.target.result;
          renderMockup();
        };
        reader.readAsDataURL(file);
      });

      renderBars();
      renderMockup();
    });
  </script>
</body>
</html>
